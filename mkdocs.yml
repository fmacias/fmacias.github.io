site_name: github.fmacias
site_description: Documentation hub for GitHub repositories, services, and profile
site_url: https://fmacias.github.io/
docs_dir: docs
site_dir: site

theme:
  name: material

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Services: Leistungen
            Overview: Ueberblick
            Getting Started: Erste Schritte
            Core Concepts: Kernkonzepte
            Queues: Queues
            Architecture: Architektur
            Development: Entwicklung
            Operations: Betrieb
            Reference: Referenz
            Reference Hub: Referenz Hub
            License: Lizenz
            Install: Installation
            First Queue: Erste Queue
            First Job Graph: Erster Job-Graph
            Public Samples: Oeffentliche Samples
            Jobs: Jobs
            Job Roots: Job Roots
            Payload Jobs: Payload Jobs
            Job Graphs: Job-Graphen
            Retry Selection: Retry-Auswahl
            Parallel Queue: Parallele Queue
            FIFO Queue: FIFO Queue
            Cache Queue: Cache Queue
            Pause and Resume: Pause und Resume
            Cancellation: Cancellation
            Cross-Queue Ownership: Cross-Queue Ownership
            Reactive Dequeue Strategy: Reaktive Dequeue-Strategie
            Runtime Model: Runtime-Modell
            Core / Adapter Boundary: Core / Adapter Grenze
            Payload Handler Integration: Payload-Handler-Integration
            Observer Event Publication: Observer Event Publication
            Cache and Persistence Boundary: Cache- und Persistenzgrenze
            Diagrams: Diagramme
            Observability: Observability
            Retry Policies: Retry Policies
            Cache-Backed Recovery: Cache-Backed Recovery
            Build and Test: Build und Test
            Strong-Name Signing: Strong-Name Signing
            Versioning and Release: Versionierung und Release
            Extending Queues: Queues erweitern
            Extending Observers: Observer erweitern
            Extending Retry Policies: Retry Policies erweitern
            Serialization Modules: Serialisierungs-Module
            Dependency Injection: Dependency Injection
            C# Language Version Policy: C# Sprachversionsrichtlinie
            API Facade: API Fassade
            CoreApi: CoreApi
            IJobFactory: IJobFactory
            IDataJobFactory: IDataJobFactory
            IQFactory: IQFactory
            Public Packages: Oeffentliche Pakete
            Samples: Samples
            License Overview: Lizenz-Ueberblick
            Core License: Core Lizenz
            MIT Adapter Modules: MIT Adapter Module
            Production Use: Produktionseinsatz
            Profile: Profil
            Contact: Kontakt

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - md_in_html
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/hero.css
  - assets/stylesheets/landing.css

extra_javascript:
  - assets/javascripts/language-preference.js

nav:
  - TplQueue:
      - Overview: tplqueue/index.md
      - Getting Started:
          - Overview: tplqueue/getting-started/index.md
          - Install: tplqueue/getting-started/install.md
          - First Queue: tplqueue/getting-started/first-queue.md
          - First Job Graph: tplqueue/getting-started/first-job-graph.md
          - Public Samples: tplqueue/getting-started/public-samples.md
      - Core Concepts:
          - Overview: tplqueue/core-concepts/index.md
          - Jobs: tplqueue/core-concepts/jobs.md
          - Job Roots: tplqueue/core-concepts/job-roots.md
          - Payload Jobs: tplqueue/core-concepts/payload-jobs.md
          - Job Graphs: tplqueue/core-concepts/job-graphs.md
          - Retry Selection: tplqueue/core-concepts/retry-selection.md
      - Queues:
