      - Architecture:
          - Overview: tplqueue/architecture/index.md
          - Runtime Model: tplqueue/architecture/runtime-model.md
          - Core / Adapter Boundary: tplqueue/architecture/core-adapter-boundary.md
          - Payload Handler Integration: tplqueue/architecture/payload-handler-integration.md
          - Observer Event Publication: tplqueue/architecture/observer-event-publication.md
          - Cache and Persistence Boundary: tplqueue/architecture/cache-persistence-boundary.md
          - Diagrams: tplqueue/architecture/diagrams.md
      - Operations:
          - Overview: tplqueue/operations/index.md
          - Observability: tplqueue/operations/observability.md
          - Retry Policies: tplqueue/operations/retry-policies.md
          - Cache-Backed Recovery: tplqueue/operations/cache-backed-recovery.md
          - Build and Test: tplqueue/operations/build-and-test.md
          - Strong-Name Signing: tplqueue/operations/strong-name-signing.md
          - Versioning and Release: tplqueue/operations/versioning-release.md
      - Development:
          - Overview: tplqueue/development/index.md
          - Extending Queues: tplqueue/development/extending-queues.md
          - Extending Observers: tplqueue/development/extending-observers.md
          - Extending Retry Policies: tplqueue/development/extending-retry-policies.md
          - Serialization Modules: tplqueue/development/serialization-modules.md
          - Dependency Injection: tplqueue/development/dependency-injection.md
          - C# Language Version Policy: tplqueue/development/csharp-language-version.md
      - Reference:
          - Reference Hub: tplqueue/reference/index.md
          - API Facade: tplqueue/reference/api-facade.md
          - CoreApi: tplqueue/reference/core-api.md
          - IJobFactory: tplqueue/reference/ijobfactory.md
          - IDataJobFactory: tplqueue/reference/idatajobfactory.md
          - IQFactory: tplqueue/reference/iqfactory.md
          - Public Packages: tplqueue/reference/packages.md
          - Samples: tplqueue/reference/samples.md
      - License:
          - License Overview: tplqueue/license/index.md
          - Core License: tplqueue/license/core-license.md
          - MIT Adapter Modules: tplqueue/license/mit-adapter-modules.md
          - Production Use: tplqueue/license/production-use.md
  - Services: services.md
  - Profile: profile.md
  - Contact: contact.md
