site_name: github.fmacias
site_description: Documentation hub for GitHub repositories, services, and profile
site_url: https://fmacias.github.io/
docs_dir: docs
site_dir: site

theme:
  name: material

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Services: Leistungen
            Overview: Ueberblick
            Getting Started: Erste Schritte
            Architecture: Architektur
            Development: Entwicklung
            Operations: Betrieb
            Reference Hub: Referenz
            Core Engine: Core Engine
            Usage: Nutzung
            Full Reference: Vollstaendige Referenz
            Core License: Core Lizenz
            Profile: Profil
            Contact: Kontakt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/hero.css
  - assets/stylesheets/landing.css

extra_javascript:
  - assets/javascripts/language-preference.js

nav:
  - TplQueue:
      - Overview: tplqueue/index.md
      - Getting Started: tplqueue/usage/index.md
      - Architecture: tplqueue/architecture/index.md
      - Development: tplqueue/development/index.md
      - Operations: tplqueue/operations/index.md
      - Reference Hub: tplqueue/reference.md
      - Core Engine:
          - Overview: tplqueue/core-engine/index.md
          - Usage: tplqueue/core-engine/usage/index.md
          - Architecture: tplqueue/core-engine/architecture/index.md
          - Development: tplqueue/core-engine/development/index.md
          - Operations: tplqueue/core-engine/operations/index.md
          - Full Reference: tplqueue/core-engine/reference.md
      - Core License: tplqueue/core-license.md
  - Services: services.md
  - Profile: profile.md
  - Contact: contact.md
