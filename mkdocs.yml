site_name: Fernando Macias
site_description: Professional profile and curated technical documentation
site_url: https://fmacias.github.io/
docs_dir: docs
site_dir: site

theme:
  name: material

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Services: Leistungen
            Overview: Ueberblick
            Architecture: Architektur
            Getting Started: Erste Schritte
            Public Repositories: Oeffentliche Repositories
            Core License: Core Lizenz
            Profile: Profil
            Contact: Kontakt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/hero.css
  - assets/stylesheets/landing.css

extra_javascript:
  - assets/javascripts/language-preference.js

nav:
  - Services: services.md
  - TplQueue:
      - Overview: tplqueue/overview.md
      - Architecture: tplqueue/architecture.md
      - Getting Started: tplqueue/getting-started.md
      - Public Repositories:
          - Overview: tplqueue/repositories/index.md
          - Abstractions: tplqueue/repositories/abstractions.md
          - Adapter: tplqueue/repositories/adapter.md
          - Usage: tplqueue/repositories/usage.md
      - Core License: tplqueue/core-license.md
  - Profile: profile.md
  - Contact: contact.md
