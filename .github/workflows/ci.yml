name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fmacias/TplQueue.Abstractions
          path: .external-src/TplQueue.Abstractions
      - uses: actions/checkout@v4
        with:
          repository: fmacias/TplQueue.Adapter
          path: .external-src/TplQueue.Adapter
      - uses: actions/checkout@v4
        with:
          repository: fmacias/TplQueue.Usage
          path: .external-src/TplQueue.Usage
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - run: python scripts/sync_tplqueue_public_docs.py --source-base .external-src
      - run: mkdocs gh-deploy --force
